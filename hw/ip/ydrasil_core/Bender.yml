package:
  name: ydrasil::core
  description: Core IP for Ydrasil RV32I core

dependencies:
  ydrasil::utils:
    path: ../ydrasil_utils

sources:
  - target: any(verilator, iverilog, vcs)
    include_dirs:
      - rtl
    files:
      - rtl/ydrasil_pkg.sv
      - rtl/ydrasil_branch_predictor.sv
      - rtl/ydrasil_alu.sv
      - rtl/ydrasil_if_stage.sv
      - rtl/ydrasil_id_stage.sv
      - rtl/ydrasil_issue_compact.sv
      - rtl/ydrasil_issue_source_resolver.sv
      - rtl/ydrasil_issue_stage.sv
      - rtl/ydrasil_ins_decoder.sv
      - rtl/ydrasil_mul.sv
      - rtl/ydrasil_lzc.sv
      - rtl/ydrasil_div.sv
      - rtl/ydrasil_bitmanip.sv
      - rtl/ydrasil_bru.sv
      - rtl/ydrasil_ex_block.sv
      - rtl/ydrasil_execute_stage.sv
      - rtl/ydrasil_load_store_unit.sv
      - rtl/ydrasil_completion_ctrl.sv
      - rtl/ydrasil_mems.sv
      - rtl/ydrasil_registers.sv
      - rtl/ydrasil_registers_csr.sv
      - rtl/ydrasil_csr_stage.sv
      - rtl/ydrasil_exception_ctrl.sv
      - rtl/ydrasil_exception_stage.sv
      - rtl/ydrasil_value_file.sv
      - rtl/ydrasil_ctrl.sv
      - rtl/ydrasil_core.sv


  - target: ip_tb
    defines:
      YDRASIL_RETIRE_TRACE:
    files:
      - ../jyd_fpga/rtl/seg7.sv
      - ../jyd_fpga/rtl/display_seg.sv
      - ../jyd_fpga/rtl/counter.sv
      - ../jyd_fpga/rtl/perip_bridge.sv
      - ../jyd_fpga/rtl/ydrasil_mmio_subsystem.sv
      - dv/ydrasil_commit_trace.sv
      - dv/ydrasil_core_tb.sv
      - dv/ydrasil_branch_predictor_tb.sv
      - dv/ydrasil_bht_clear_tb.sv
      - dv/ydrasil_gshare_recovery_tb.sv
      - dv/ydrasil_bus_irq_tb.sv

  - target: fpu
    files:
      - rtl/ydrasil_fpu_math_pkg.sv
      - rtl/ydrasil_fpu_fma.sv
      - rtl/ydrasil_fpu_to_int.sv
      - rtl/ydrasil_fpu_divsqrt.sv
      - rtl/ydrasil_fpu_registers.sv
      - rtl/ydrasil_fpu.sv
