package:
  name: ydrasil::core
  description: Core IP for Ydrasil RV32I core

dependencies:
  ydrasil::memory:
    path: ../ydrmem
  ydrasil::utils:
    path: ../ydrasil_utils

sources:
  - target: any(verilator, iverilog, vcs)
    include_dirs:
      - rtl
    files:
      - rtl/ydrasil_pkg.sv
      - rtl/ydrasil_branch_predictor.sv
      - rtl/ydrasil_alu.sv
      - rtl/ydrasil_if_stage.sv
      - rtl/ydrasil_id_stage.sv
      - rtl/ydrasil_issue_stage.sv
      - rtl/ydrasil_ins_decoder.sv
      - rtl/ydrasil_mul.sv
      - rtl/ydrasil_lzc.sv
      - rtl/ydrasil_div.sv
      - rtl/ydrasil_bitmanip.sv
      - rtl/ydrasil_bru.sv
      - rtl/ydrasil_ex_block.sv
      - rtl/ydrasil_load_store_unit.sv
      - rtl/ydrasil_mems.sv
      - rtl/ydrasil_wb_stage.sv
      - rtl/ydrasil_registers.sv
      - rtl/ydrasil_registers_csr.sv
      - rtl/ydrasil_exception_ctrl.sv
      - rtl/ydrasil_ctrl.sv
      - rtl/ydrasil_core.sv
      - ../Xilinx_ip_wrapper/rtl/xpm_lutram_1r1w.sv


  - target: ip_tb
    files:
      - ../jyd_fpga/rtl/seg7.sv
      - ../jyd_fpga/rtl/display_seg.sv
      - ../jyd_fpga/rtl/counter.sv
      - ../jyd_fpga/rtl/perip_bridge.sv
      - ../jyd_fpga/rtl/ydrasil_mmio_subsystem.sv
      - dv/ydrasil_commit_trace.sv
      - dv/ydrasil_core_tb.sv
      - dv/ydrasil_branch_predictor_tb.sv
      - dv/ydrasil_bht_clear_tb.sv
      - dv/ydrasil_bus_irq_tb.sv

  - target: fpu
    include_dirs:
      - ../../vendor/cvfpu/src/common_cells/include
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/clk/rtl
    files:
      - ../../vendor/cvfpu/src/common_cells/src/cf_math_pkg.sv
      - ../../vendor/cvfpu/src/common_cells/src/lzc.sv
      - ../../vendor/cvfpu/src/common_cells/src/rr_arb_tree.sv
      - ../../vendor/cvfpu/src/fpnew_pkg.sv
      - rtl/ydrasil_fpnew_cast_multi.sv
      - ../../vendor/cvfpu/src/fpnew_classifier.sv
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/clk/rtl/gated_clk_cell.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_ctrl.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_ff1.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_pack_single.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_prepare.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_round_single.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_special.v
      - ../../vendor/cvfpu/vendor/opene906/E906_RTL_FACTORY/gen_rtl/fdsu/rtl/pa_fdsu_srt_single.v
